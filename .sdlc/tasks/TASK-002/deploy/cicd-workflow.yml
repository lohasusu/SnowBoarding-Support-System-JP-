# =============================================================
# TASK-002 CI/CD Workflow — GitHub Actions
# =============================================================
# Phase: deploy (Execute)
# Date: 2026-06-12
# Author: Deployer (Execute)
#
# 設計依據:
# - deploy-plan.md §1 (6 階段 Pipeline)
# - deploy-plan.md §2 (Path-based CI 觸發)
# - service-contract.yaml ci_path_filters
# - CLAUDE.md (Railway 部署 + uvicorn entrypoint 鎖定)
# - deploy-env.json (cicd=github-actions, platform=paas/railway, scope=full)
# - sast-report.md (bandit + pip-audit gate)
#
# 安裝方式：
#   將本檔複製到 `.github/workflows/ci-be.yml`（drop .tpl suffix if any）
#
# Railway 整合：
#   本 workflow 為 CI 把關（lint / test / security scan / migration test）
#   Railway 透過 GitHub App 監聽 `main` 分支 push 自動觸發 redeploy（railway.toml + railway dashboard 配置）
#   本 workflow 不直接 deploy；Railway 收到 main push 自動執行 `pip install -r requirements.txt` + uvicorn 啟動
# =============================================================

name: TASK-002 CI (Backend + Migration)

on:
  pull_request:
    branches: [main]
    paths:
      # Backend 程式碼變動
      - 'web/**'
      - 'flight_search/**'
      - '*.py'
      - 'requirements.txt'
      - 'http_scraper.py'
      # Migration 變動
      - 'migrations/**'
      - 'alembic.ini'
      - 'scripts/migrate_*.py'
      # Infra 變動
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - 'railway.toml'
      # Workflow 本身
      - '.github/workflows/ci-be.yml'

  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'flight_search/**'
      - '*.py'
      - 'requirements.txt'
      - 'migrations/**'
      - 'alembic.ini'
      - 'scripts/migrate_*.py'

  # Manual trigger for ad-hoc verification
  workflow_dispatch:

# Bind permissions explicitly (least privilege)
permissions:
  contents: read
  pull-requests: write   # for posting SAST comments

# Cancel in-progress runs when new push to same PR
concurrency:
  group: ci-be-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===============================================
  # Job 1: Lint + Static checks (fast feedback < 2min)
  # ===============================================
  lint:
    name: Lint (ruff / black --check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 black==24.10.0

      - name: Run ruff
        run: ruff check web/ flight_search/ --exclude web/auth/database_sqlite.py
        # database_sqlite.py 為 14 天 emergency path 保留，不強制 lint

      - name: Run black --check
        run: black --check web/ flight_search/ --exclude 'web/auth/database_sqlite\.py'

  # ===============================================
  # Job 2: Security scan (bandit + pip-audit)
  # Scope-aware gate: scope=full → Critical/High block
  # ===============================================
  security:
    name: Security Scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.9.4 pip-audit==2.10.1
          pip install -r requirements.txt

      - name: Run bandit (production code)
        id: bandit
        run: |
          set +e
          # -ll = report on LOW severity or higher
          # -ii = report on LOW confidence or higher
          # Exclude test directories (asserts + hardcoded passwords are pytest patterns)
          python -m bandit -r web/ -x web/auth/tests/ -ll -ii -f json -o bandit-report.json
          BANDIT_EXIT=$?
          # Get summary
          python -c "
          import json, sys
          data = json.load(open('bandit-report.json'))
          totals = data.get('metrics', {}).get('_totals', {})
          high = int(totals.get('SEVERITY.HIGH', 0))
          med = int(totals.get('SEVERITY.MEDIUM', 0))
          low = int(totals.get('SEVERITY.LOW', 0))
          print(f'::notice::Bandit: HIGH={high} MEDIUM={med} LOW={low}')
          # Scope=full: block on HIGH or CRITICAL
          if high > 0:
              print(f'::error::[SECURITY_BLOCKED: High={high}] bandit found HIGH severity in production code')
              sys.exit(1)
          # MEDIUM/LOW warn but don't block (per sast-report.md decisions)
          sys.exit(0)
          "

      - name: Run pip-audit (dependency vulnerabilities)
        id: pip_audit
        run: |
          set +e
          # -r requirements.txt has Windows encoding issue; scan installed env instead
          PYTHONIOENCODING=utf-8 python -m pip_audit -f json -o pip-audit-report.json
          # Parse and gate
          python -c "
          import json, sys
          data = json.load(open('pip-audit-report.json'))
          deps = data.get('dependencies', [])
          # Direct deps only — ignore pip itself (dev-only)
          direct = {'fastapi','uvicorn','psycopg','psycopg-pool','alembic','sqlalchemy','python-jose','passlib','bcrypt','httpx','python-dotenv','python-multipart','jinja2','pydantic','beautifulsoup4','requests','pytest','pytest-asyncio','testcontainers','deep-translator','serpapi','google-search-results'}
          critical_high = []
          medium = []
          for d in deps:
              name = d['name'].lower()
              if name == 'pip':  # dev tool, not runtime
                  continue
              if name not in direct and not any(p in name for p in direct):
                  continue  # transitive — skip
              for v in d.get('vulns', []):
                  desc = (v.get('description','') or '').lower()
                  vid = v.get('id','')
                  if 'critical' in desc or 'CRITICAL' in desc:
                      critical_high.append(f\"{d['name']}@{d['version']}: {vid}\")
                  elif 'high' in desc:
                      critical_high.append(f\"{d['name']}@{d['version']}: {vid}\")
                  else:
                      medium.append(f\"{d['name']}@{d['version']}: {vid}\")
          print(f'::notice::pip-audit (direct deps): critical/high={len(critical_high)} medium/other={len(medium)}')
          for f in critical_high:
              print(f'::error::[SECURITY_BLOCKED] dep vuln {f}')
          for f in medium:
              print(f'::warning::dep vuln (informational) {f}')
          if critical_high:
              sys.exit(1)
          sys.exit(0)
          "

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  # ===============================================
  # Job 3: Backend pytest (with testcontainers + PG)
  # Resolves test-be BLOCK-001 in CI (was Bash sandbox limited)
  # ===============================================
  test-backend:
    name: pytest (testcontainers + PG)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Docker daemon is available on ubuntu-latest; testcontainers will use it
      docker:
        image: docker:24-dind
        options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies (incl. test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test extras inferred from be/implementation-report.md
          pip install pytest==8.3.0 pytest-asyncio==0.24.0 'testcontainers[postgres]==4.7.2'

      - name: Run pytest (testcontainers postgres:16-alpine fixture)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest web/auth/tests/ -v --tb=short
        # Expected: 8 passed (per build-gate v2.0 task 6 result)

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: |
            .pytest_cache/
          retention-days: 7

  # ===============================================
  # Job 4: Migration up-down-up idempotency test
  # Resolves test-be BLOCK-002 in CI
  # ===============================================
  test-migration:
    name: Alembic up→down→up idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snowtrip
          POSTGRES_PASSWORD: ci_test_password_local_only
          POSTGRES_DB: snowtrip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snowtrip -d snowtrip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: snowtrip
      POSTGRES_PASSWORD: ci_test_password_local_only
      POSTGRES_DB: snowtrip
      POSTGRES_SSL_MODE: disable
      DATABASE_URL: postgresql+psycopg://snowtrip:ci_test_password_local_only@localhost:5432/snowtrip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for postgres ready
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U snowtrip -d snowtrip && break
            echo "Waiting for postgres... ($i/30)"
            sleep 2
          done

      - name: alembic upgrade head
        run: |
          alembic upgrade head
          # Verify
          alembic current

      - name: alembic downgrade -1
        run: |
          alembic downgrade -1
          alembic current

      - name: alembic upgrade head (verify idempotent)
        run: |
          alembic upgrade head
          # Should return to same head as step 1
          alembic current

  # ===============================================
  # Job 5: Env var consistency check
  # ===============================================
  env-consistency:
    name: Env Var Consistency (contract vs code)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Need history for SDLC tooling

      - name: Run env consistency check (informational)
        # This script has known limitations (false-positives for ARG/ENV Dockerfile keywords)
        # Run as informational only; do not gate merge until script improvements land
        continue-on-error: true
        run: |
          if [[ -f "$HOME/.claude/skills/sdlc/scripts/sdlc-env-consistency.sh" ]]; then
            bash "$HOME/.claude/skills/sdlc/scripts/sdlc-env-consistency.sh" TASK-002
          else
            echo "::notice::SDLC env-consistency script not available in CI runner; skipped"
          fi

  # ===============================================
  # Job 6: Aggregate gate (all required jobs must pass)
  # ===============================================
  ci-gate:
    name: TASK-002 CI Gate
    needs: [lint, security, test-backend, test-migration]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: All required jobs passed
        run: |
          echo "✅ TASK-002 CI Gate PASS"
          echo "  - Lint: ${{ needs.lint.result }}"
          echo "  - Security: ${{ needs.security.result }}"
          echo "  - Backend tests: ${{ needs.test-backend.result }}"
          echo "  - Migration tests: ${{ needs.test-migration.result }}"

# =============================================================
# Production Deploy 說明
# =============================================================
# 本 workflow 不直接 deploy。Railway production 透過 GitHub App 監聽 main 分支：
#   1. PR merge to main → Railway 接收 push event
#   2. Railway 執行 railway.toml: pip install -r requirements.txt
#   3. Railway healthcheck（依 service-contract.yaml /api/auth/me）等待 app 啟動
#   4. Healthcheck 通過 → 切流量到新版本
#   5. Healthcheck 失敗 > 2 分鐘 → Railway auto rollback 到 N-1 build
#
# Production deploy gate（GitHub Environment "production"）:
#   - 設定方法見 deploy-guide.md §3.1 Step 1
#   - required reviewers: @blacktea881030 (per deploy-env.json prodApproval.requiredReviewers)
#   - 本 workflow 完成後若 PR 被 merge，會自動觸發後續 Railway redeploy；
#     建議在 Railway dashboard 開啟 "Deploy approval" 模式（如有），讓 reviewer 在 Railway 端確認
#     若 Railway 不支援 approval gate，則仰賴 GitHub branch protection rule (require PR review before merge)
#
# 14 天 SQLite emergency rollback（FUNC-107 IRREVERSIBLE 緩解）:
#   - 詳見 deploy-guide.md §6 (rollback procedures)
#
# =============================================================
