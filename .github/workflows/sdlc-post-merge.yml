# .github/workflows/sdlc-post-merge.yml
#
# SDLC Post-Merge Workflow (Rule 19 / PR 8)
#
# Runs after merge to main. Tasks:
#   1. Rebuild shared/*.md from all journals (Rule 14)
#   2. Update id-allocator history (mark abandoned tasks etc.)
#   3. Comment on all open PRs: "main updated, please rebase"
#   4. Commit shared/ updates back to main using GITHUB_TOKEN
#
# Setup required:
#   - Repo Settings → Actions → Workflow permissions → Read and write permissions
#   - GITHUB_TOKEN must have contents:write + pull-requests:write

name: SDLC Post-Merge

on:
  push:
    branches: [main]
    paths:
      - '.sdlc/tasks/**/journal.json'
      - '.sdlc/.abandoned-tasks.txt'

permissions:
  contents: write
  pull-requests: write

env:
  SDLC_BOOTSTRAP_REPO: ${{ vars.SDLC_BOOTSTRAP_REPO || 'https://github.com/Sunyuezu0229/sdlc-workflow.git' }}
  SDLC_BOOTSTRAP_REF: ${{ vars.SDLC_BOOTSTRAP_REF || 'main' }}

jobs:
  rebuild-shared:
    runs-on: ubuntu-latest
    name: Rebuild shared/ + notify open PRs

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install jq
        run: which jq || sudo apt-get update && sudo apt-get install -y jq

      - name: Bootstrap SDLC scripts (vendored or pinned clone)
        run: |
          if [ -f "scripts/sdlc-shared-rebuild.sh" ]; then
            export SDLC_SCRIPTS=./scripts
          else
            git clone --depth=1 --branch "$SDLC_BOOTSTRAP_REF" \
              "$SDLC_BOOTSTRAP_REPO" /tmp/sdlc-tools
            export SDLC_SCRIPTS=/tmp/sdlc-tools/scripts
          fi
          echo "SDLC_SCRIPTS=$SDLC_SCRIPTS" >> $GITHUB_ENV

      - name: Rebuild shared/*.md
        run: bash $SDLC_SCRIPTS/sdlc-shared-rebuild.sh

      - name: Commit shared/ if changed
        run: |
          git config user.name "sdlc-bot"
          git config user.email "sdlc-bot@example.com"
          git add .sdlc/shared/
          if ! git diff --cached --quiet; then
            # V3-#2: audit linkage — list TASK-IDs whose journals changed in the
            # triggering merge commit so the auto-commit message references them.
            TRIGGER_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            CHANGED_TASKS=$(git diff --name-only "$TRIGGER_SHA" HEAD -- '.sdlc/tasks/**/journal.json' 2>/dev/null \
              | sed -E 's|.sdlc/tasks/(TASK-[0-9]+[a-z]?)/.*|\1|' \
              | sort -u | paste -sd ',' - || echo "unknown")
            [ -z "$CHANGED_TASKS" ] && CHANGED_TASKS="(no journal diff detected)"
            # V1-W4: use multiple -m flags for clean two-paragraph format
            git commit \
              -m "chore(sdlc): auto-rebuild shared/ for ${CHANGED_TASKS} (triggered by ${TRIGGER_SHA:0:8})" \
              -m "Generated by sdlc-post-merge workflow. Source-of-truth: each TASK's journal.json."
            git push
          else
            echo "No changes to shared/"
          fi

      - name: Notify open PRs to rebase
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const sha = context.sha.substring(0, 8);
            for (const pr of prs.data) {
              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🔄 main updated to ${sha} — please rebase to pick up the latest shared/ rebuild and avoid stale references.`
              });
            }
