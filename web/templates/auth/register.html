{% extends "base.html" %}
{% block title %}註冊 — SnowTrip Japan{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block extra_head %}
<script src="/static/js/auth.js" defer></script>
{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:420px">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h1 class="h4 fw-bold mb-4 text-center">
        <i class="bi bi-snow text-primary me-2"></i>建立帳號
      </h1>
      <form id="register-form" novalidate>
        <div class="mb-3">
          <label for="reg-email" class="form-label fw-semibold">Email</label>
          <input type="email" id="reg-email" class="form-control" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label for="reg-username" class="form-label fw-semibold">用戶名稱</label>
          <input type="text" id="reg-username" class="form-control" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label for="reg-password" class="form-label fw-semibold">密碼（至少 8 字元）</label>
          <input type="password" id="reg-password" class="form-control" required minlength="8" autocomplete="new-password">
        </div>
        <div id="register-error" class="alert alert-danger d-none"></div>
        <div id="register-ok" class="alert alert-success d-none"></div>
        <button type="submit" class="btn btn-primary w-100">建立帳號</button>
      </form>
      <hr class="my-3">
      <p class="text-center small mb-0">
        已有帳號？<a href="/login">立即登入</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
