{% extends "base.html" %}
{% block title %}登入 — SnowTrip Japan{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block extra_head %}
<script src="/static/js/auth.js" defer></script>
{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:420px">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h1 class="h4 fw-bold mb-4 text-center">
        <i class="bi bi-snow text-primary me-2"></i>登入
      </h1>

      <!-- URL 參數提示（驗證成功/失敗訊息） -->
      <div id="login-alert"></div>

      <!-- Google 登入 -->
      <div class="d-grid mb-3">
        <a href="/api/auth/google/login" class="btn btn-outline-danger btn-lg">
          <svg class="me-2" xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          使用 Google 帳號登入
        </a>
      </div>
      <div class="d-flex align-items-center mb-3">
        <hr class="flex-grow-1"><span class="mx-2 text-muted small">或使用 Email 登入</span><hr class="flex-grow-1">
      </div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="login-email" class="form-label fw-semibold">Email</label>
          <input type="email" id="login-email" class="form-control" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label for="login-password" class="form-label fw-semibold">密碼</label>
          <input type="password" id="login-password" class="form-control" required autocomplete="current-password">
        </div>
        <div id="login-error" class="alert alert-danger d-none"></div>
        <!-- 未驗證時顯示「重寄驗證信」區塊 -->
        <div id="resend-area" class="d-none mb-2">
          <button type="button" id="resend-btn" class="btn btn-sm btn-outline-warning w-100">重寄驗證信</button>
        </div>
        <button type="submit" class="btn btn-primary w-100">登入</button>
      </form>
      <hr class="my-3">
      <p class="text-center small mb-0">
        還沒有帳號？<a href="/register">立即註冊</a>
      </p>
    </div>
  </div>
</div>

<script>
(function() {
  // URL 參數提示處理
  const params = new URLSearchParams(window.location.search);
  const alertArea = document.getElementById('login-alert');

  if (params.get('verified') === '1') {
    alertArea.innerHTML = '<div class="alert alert-success">&#x2705; Email 驗證成功！請登入您的帳號。</div>';
  } else if (params.get('error') === 'invalid_token' || params.get('error') === 'token_used') {
    alertArea.innerHTML = '<div class="alert alert-danger">&#x274C; 驗證連結已失效或已使用，請重新寄送驗證信。</div>';
  } else if (params.get('error') === 'token_expired') {
    alertArea.innerHTML = '<div class="alert alert-warning">&#x23F0; 驗證連結已過期（24 小時），請重新寄送驗證信。</div>';
  } else if (params.get('error') === 'unverified') {
    alertArea.innerHTML = '<div class="alert alert-warning">&#x1F4E7; 請先驗證您的 Email 後再登入。</div>';
  }

  // 重寄驗證信按鈕
  const resendBtn = document.getElementById('resend-btn');
  const resendArea = document.getElementById('resend-area');
  if (resendBtn) {
    resendBtn.addEventListener('click', async function() {
      const email = document.getElementById('login-email').value.trim();
      if (!email) {
        alert('請先在上方輸入您的 Email');
        return;
      }
      resendBtn.disabled = true;
      resendBtn.textContent = '寄送中...';
      try {
        const res = await fetch('/api/auth/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const json = await res.json();
        const errEl = document.getElementById('login-error');
        errEl.textContent = json.message || (res.ok ? '驗證信已寄出' : '寄送失敗');
        errEl.className = res.ok ? 'alert alert-info' : 'alert alert-danger';
        errEl.classList.remove('d-none');
      } catch(e) {
        alert('寄送失敗：' + e.message);
      } finally {
        resendBtn.disabled = false;
        resendBtn.textContent = '重寄驗證信';
      }
    });
  }
})();
</script>
{% endblock %}
