{% extends "base.html" %}
{% block title %}登入 — SnowTrip Japan{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block extra_head %}
<script src="/static/js/auth.js" defer></script>
{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:420px">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h1 class="h4 fw-bold mb-4 text-center">
        <i class="bi bi-snow text-primary me-2"></i>登入
      </h1>

      <!-- 註冊成功提示 -->
      <div id="login-alert"></div>

      <!-- Google 登入 -->
      <div class="d-grid mb-3">
        <a href="/api/auth/google/login" class="btn btn-outline-danger btn-lg">
          <svg class="me-2" xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          使用 Google 帳號登入
        </a>
      </div>
      <div class="d-flex align-items-center mb-3">
        <hr class="flex-grow-1"><span class="mx-2 text-muted small">或使用帳號登入</span><hr class="flex-grow-1">
      </div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="login-identifier" class="form-label fw-semibold">Email 或使用者名稱</label>
          <input type="text" id="login-identifier" class="form-control" required autocomplete="username" placeholder="輸入 Email 或使用者名稱">
        </div>
        <div class="mb-3">
          <label for="login-password" class="form-label fw-semibold">密碼</label>
          <input type="password" id="login-password" class="form-control" required autocomplete="current-password">
        </div>
        <div id="login-error" class="alert alert-danger d-none"></div>
        <button type="submit" class="btn btn-primary w-100">登入</button>
      </form>
      <hr class="my-3">
      <p class="text-center small mb-0">
        還沒有帳號？<a href="/register">立即註冊</a>
      </p>
    </div>
  </div>
</div>

<script>
(function() {
  // 註冊成功提示（從 register 跳轉而來）
  const params = new URLSearchParams(window.location.search);
  if (params.get('registered') === '1') {
    document.getElementById('login-alert').innerHTML =
      '<div class="alert alert-success">&#x2705; 註冊成功！請使用剛建立的帳號登入。</div>';
  }
})();
</script>
{% endblock %}
