{% extends "base.html" %}

{% block title %}登入 — SnowTrip Japan{% endblock %}
{% block description %}登入 SnowTrip Japan 會員帳號{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-5 col-lg-4">

      <div class="text-center mb-4">
        <a href="/" aria-label="回首頁">
          <i class="bi bi-snow fs-1 text-primary" aria-hidden="true"></i>
        </a>
        <h1 class="h4 fw-bold mt-2">會員登入</h1>
      </div>

      <!-- 即將推出提示 -->
      <div class="alert alert-info d-flex align-items-center gap-2 mb-4" role="alert">
        <i class="bi bi-info-circle-fill flex-shrink-0" aria-hidden="true"></i>
        <div>會員功能正在開發中，敬請期待。</div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form aria-label="登入表單" aria-disabled="true">
            <fieldset disabled>
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">電子郵件</label>
                <input type="email" id="email" class="form-control"
                       placeholder="your@email.com" autocomplete="email">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">密碼</label>
                <input type="password" id="password" class="form-control"
                       autocomplete="current-password">
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember">
                  <label class="form-check-label small" for="remember">記住我</label>
                </div>
                <a href="#" class="small text-decoration-none text-muted">忘記密碼？</a>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">登入</button>
              </div>
            </fieldset>
          </form>

          <hr class="my-3">
          <p class="text-center small mb-0">
            還沒有帳號？
            <a href="/register" class="text-decoration-none">立即註冊</a>
          </p>
        </div>
      </div>

      <p class="text-center mt-3">
        <a href="/" class="text-muted small text-decoration-none">
          <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>回首頁
        </a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
