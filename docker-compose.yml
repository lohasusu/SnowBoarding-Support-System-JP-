# SDLC docker-compose template (PR 13c — truly tech-stack agnostic)
#
# This template is engine-agnostic: works for postgres / mysql / mongodb / redis
# without manual edits per project. The trick is:
#   - All variable values come from `.env` (rendered by sdlc-render-docker-env.sh from config.json)
#   - The DB container's engine-specific env vars (POSTGRES_DB / MYSQL_DATABASE / MONGO_INITDB_DATABASE)
#     are written by render-docker-env.sh into `.env` based on the chosen engine, so we just reference them
#     here generically. Each engine reads only its own keys.
#
# Setup:
#   1. Copy this file to project root as `docker-compose.yml`
#   2. Copy Dockerfile.fe.tpl + Dockerfile.be.tpl to {fe,be}/Dockerfile
#   3. Run: bash scripts/sdlc-render-docker-env.sh [TASK-ID]
#      ↳ generates .env / .env.frontend / .env.backend with engine-aware values
#   4. Run: docker compose up
#
# Service contract (Rule 7 / deployer):
#   - port mappings MUST match `service-contract.yaml`
#   - env var names MUST match `service-contract.yaml`
#   - DON'T hardcode secrets — use .env (gitignored) or external secret manager

services:
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        # PR 13c: build-stage and serve-stage both parameterized (V1.C4 fix)
        FE_BUILD_IMAGE: "${FE_BUILD_IMAGE:-node:22-alpine}"
        FE_SERVE_IMAGE: "${FE_SERVE_IMAGE:-nginx:alpine}"
        FE_BUILD_CMD: "${FE_BUILD_CMD:-npm run build}"
    ports:
      - "${FE_PORT:-3000}:${FE_PORT:-3000}"
    env_file:
      # PR 13c: FE env vars (with framework prefix VITE_/NEXT_PUBLIC_/VUE_APP_/NG_APP_/PUBLIC_)
      # live in .env.frontend, generated by sdlc-render-docker-env.sh from config.json
      - path: ./.env.frontend
        required: false
    environment:
      FE_PORT: "${FE_PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${FE_PORT:-3000}/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
      args:
        BE_RUNTIME: "${BE_RUNTIME:-node:22-alpine}"
        BE_PKG_MANAGER: "${BE_PKG_MANAGER:-npm}"
    ports:
      - "${BE_PORT:-8000}:${BE_PORT:-8000}"
    env_file:
      - path: ./.env.backend
        required: false
    environment:
      # Generic DB connection vars — sdlc-render-docker-env.sh writes engine-specific
      # equivalents (POSTGRES_USER / MYSQL_USER / MONGO_INITDB_ROOT_USERNAME) AND these
      # generic aliases to .env. Backend app reads these generic names.
      DB_HOST: "database"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-app}"
      DB_USER: "${DB_USER:-app}"
      DB_PASSWORD: "${DB_PASSWORD:-changeme_in_dotenv}"
      JWT_SECRET: "${JWT_SECRET:-changeme_in_dotenv}"
      API_PORT: "${BE_PORT:-8000}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${BE_PORT:-8000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  database:
    # PR 13c: image driven by .env (DB_IMAGE auto-derived from config.json.techStack.database)
    image: "${DB_IMAGE:-postgres:16-alpine}"
    ports:
      # DB_PORT is engine-aware: postgres=5432 / mysql=3306 / mongo=27017 / redis=6379
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    environment:
      # PR 13c: ALL three engine-specific env var sets are present.
      # Each DB image reads ONLY its own prefix; the others are ignored.
      # sdlc-render-docker-env.sh writes only the relevant ones to .env (others empty),
      # so unused vars are just blank strings — no harm.
      #
      # Postgres-specific (read by postgres image only):
      POSTGRES_DB: "${POSTGRES_DB:-${DB_NAME:-app}}"
      POSTGRES_USER: "${POSTGRES_USER:-${DB_USER:-app}}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-${DB_PASSWORD:-changeme_in_dotenv}}"
      # MySQL-specific (read by mysql image only):
      MYSQL_DATABASE: "${MYSQL_DATABASE:-${DB_NAME:-app}}"
      MYSQL_USER: "${MYSQL_USER:-${DB_USER:-app}}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-${DB_PASSWORD:-changeme_in_dotenv}}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:-changeme_in_dotenv}}"
      # MongoDB-specific (read by mongo image only):
      MONGO_INITDB_DATABASE: "${MONGO_INITDB_DATABASE:-${DB_NAME:-app}}"
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-${DB_USER:-app}}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-${DB_PASSWORD:-changeme_in_dotenv}}"
    volumes:
      # PR 13c V1.C1 fix: volume path engine-aware via ${DB_DATA_DIR}
      # render-docker-env.sh writes DB_DATA_DIR per engine:
      #   postgres → /var/lib/postgresql/data
      #   mysql    → /var/lib/mysql
      #   mongodb  → /data/db
      #   redis    → /data
      - sdlc-db-data:${DB_DATA_DIR:-/var/lib/postgresql/data}
    healthcheck:
      # PR 13c V1.C2 fix: healthcheck uses engine-SPECIFIC env vars that DO exist
      # in the database container's environment block above (POSTGRES_USER vs MYSQL_USER vs MONGO_INITDB_ROOT_USERNAME).
      # The previous version `pg_isready -U $DB_USER -d $DB_NAME` referenced vars NOT exported into the DB container,
      # so they evaluated to empty inside the container → healthcheck never went healthy.
      #
      # Engine-specific commands written to .env by render-docker-env.sh:
      #   postgres → pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      #   mysql    → mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD
      #   mongodb  → mongosh --quiet --eval "db.runCommand({ping: 1}).ok" | grep -q 1
      #   redis    → redis-cli ping
      # Note the $$ prefix — that escapes compose's variable expansion so the literal $VAR
      # is passed into the container, where it expands against the container's own env.
      test: ["CMD-SHELL", "${DB_HEALTHCHECK:-pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sdlc-db-data:
    name: sdlc-db-data
